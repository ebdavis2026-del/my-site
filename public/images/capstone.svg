<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Capstone make-it-land diagram">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111827"/>
    </marker>
  </defs>
  <!-- Analysis -->
  <ellipse cx="110" cy="140" rx="92" ry="54" fill="#f0f8ff" stroke="#1f2937" stroke-width="2"/>
  <text x="110" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Analysis</text>
  <text x="110" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">sound reasoning</text>
  <!-- Visualization -->
  <ellipse cx="320" cy="140" rx="100" ry="54" fill="#f0f8ff" stroke="#1f2937" stroke-width="2"/>
  <text x="320" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Visualization</text>
  <text x="320" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">see and believe</text>
  <!-- Action -->
  <ellipse cx="530" cy="140" rx="88" ry="54" fill="#f0f8ff" stroke="#1f2937" stroke-width="2"/>
  <text x="530" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Action</text>
  <text x="530" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">someone decides</text>
  <line x1="202" y1="140" x2="218" y2="140" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="140" x2="440" y2="140" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Make it land</text>
  <text x="320" y="274" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563">Turn reasoning into a decision someone can act on</text>
</svg>
