<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Tech foundations live site diagram">
  <rect width="640" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111827"/>
    </marker>
  </defs>
  <!-- Code -->
  <ellipse cx="120" cy="140" rx="92" ry="54" fill="#f0f8ff" stroke="#1f2937" stroke-width="2"/>
  <text x="120" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Code</text>
  <text x="120" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">write the decision</text>
  <!-- Deploy -->
  <ellipse cx="320" cy="140" rx="96" ry="54" fill="#f0f8ff" stroke="#1f2937" stroke-width="2"/>
  <text x="320" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Deploy</text>
  <text x="320" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">put it on the web</text>
  <!-- Live Site -->
  <ellipse cx="520" cy="140" rx="92" ry="54" fill="#f0f8ff" stroke="#1f2937" stroke-width="2"/>
  <text x="520" y="132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Live Site</text>
  <text x="520" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">keeps working</text>
  <line x1="212" y1="140" x2="222" y2="140" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="416" y1="140" x2="426" y2="140" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="250" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827">Tech Foundations</text>
  <text x="320" y="274" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563">A decision in code can run while you sleep</text>
</svg>
