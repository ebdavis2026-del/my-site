<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Reasoning under uncertainty diagram">
  <rect width="640" height="320" fill="#ffffff"/>
  <!-- Prior -->
  <ellipse cx="110" cy="160" rx="88" ry="52" fill="#f0f8ff" stroke="#1f2937" stroke-width="2"/>
  <text x="110" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Prior</text>
  <text x="110" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">belief so far</text>
  <!-- Evidence -->
  <ellipse cx="320" cy="160" rx="96" ry="52" fill="#f0f8ff" stroke="#1f2937" stroke-width="2"/>
  <text x="320" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Evidence</text>
  <text x="320" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">new information</text>
  <!-- Posterior -->
  <ellipse cx="530" cy="160" rx="88" ry="52" fill="#f0f8ff" stroke="#1f2937" stroke-width="2"/>
  <text x="530" y="152" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#111827">Posterior</text>
  <text x="530" y="174" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#374151">updated belief</text>
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#111827"/>
    </marker>
  </defs>
  <line x1="198" y1="160" x2="222" y2="160" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="416" y1="160" x2="440" y2="160" stroke="#111827" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="280" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">Choose well before you know the outcome</text>
</svg>
